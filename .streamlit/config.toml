# Base theme — the in-app "Dark mode" toggle layers a full CSS theme on top of
# this at runtime; these values just set a sane first paint before that loads.
[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f5f7fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a2233"
font = "sans serif"

[client]
toolbarMode = "minimal"
